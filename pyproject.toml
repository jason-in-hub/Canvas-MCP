[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-mcp"
version = "0.1.0"
description = "Read-only MCP server for HKUST Canvas (Microsoft SSO), credentials never pass through the AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.10",
  "httpx>=0.27",
  "playwright>=1.45",
  "keyring>=24",
  "cryptography>=42",
  "firecrawl-anydoc>=0.2.4",   # office/ebook -> Markdown (local, MIT)
  "pymupdf4llm>=0.2",          # PDF -> Markdown + page rendering (AGPL; fine for personal use)
  "python-pptx>=0.6.23",       # slide titles/markers + picture fallback
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "python-docx>=1.1"]

[project.scripts]
canvas-mcp = "canvas_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
